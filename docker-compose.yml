services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "openwebui", "-U", "openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG}
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENV=dev

      # Tool 用（必要なら）
      - LLM_SERVICE_API_KEY=${LLM_SERVICE_API_KEY}
      - LLM_SERVICE_API_BASE=${LLM_SERVICE_API_BASE}   # /api or /v1 まで含めた完成形
      - LLM_SERVICE_MODEL=${LLM_SERVICE_MODEL}

    extra_hosts:
      - host.docker.internal:host-gateway

  open-webui-api:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3002:8080"
    volumes:
      - open-webui-data:/app/backend/data
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENV=dev

      # Tool 用（必要なら）
      - LLM_SERVICE_API_KEY=${LLM_SERVICE_API_KEY}
      - LLM_SERVICE_API_BASE=${LLM_SERVICE_API_BASE}   # /api or /v1 まで含めた完成形
      - LLM_SERVICE_MODEL=${LLM_SERVICE_MODEL}

    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  postgres-data: {}
  ollama-data: {}
  open-webui-data: {}
  # redis-data: {}   # Redis 永続化したい場合のみ有効化
